<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#0f172a">DevChipBoard v2.2: what is on the board</text>

  <!-- carrier and module outlines -->
  <rect x="215" y="48" width="725" height="355" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="6 4"/>
  <text x="230" y="70" font-size="13" fill="#1d4ed8" font-weight="600">DevChipBoard carrier</text>
  <rect x="640" y="85" width="290" height="305" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4"/>
  <text x="655" y="106" font-size="13" fill="#15803d" font-weight="600">Tang Primer 20K module</text>

  <!-- boxes -->
  <rect x="20" y="150" width="160" height="70" rx="10" fill="#f8fafc" stroke="#334155"/>
  <text x="100" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Your computer</text>
  <text x="100" y="200" text-anchor="middle" font-size="12" fill="#475569">devchip.py</text>

  <rect x="245" y="150" width="150" height="70" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="320" y="180" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">CP2105</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#475569">dual USB-UART</text>

  <rect x="440" y="95" width="170" height="80" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="525" y="122" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">ChipLoader</text>
  <text x="525" y="141" text-anchor="middle" font-size="11.5" fill="#475569">ARM Linux computer</text>
  <text x="525" y="158" text-anchor="middle" font-size="11.5" fill="#475569">runs openFPGALoader</text>

  <rect x="440" y="210" width="170" height="60" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="525" y="236" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">DirtyJTAG adapter</text>
  <text x="525" y="255" text-anchor="middle" font-size="11.5" fill="#475569">USB 1209:c0ca</text>

  <rect x="665" y="120" width="235" height="100" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.6"/>
  <text x="782" y="147" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Gowin GW2A-18C FPGA</text>
  <text x="782" y="166" text-anchor="middle" font-size="11.5" fill="#475569">20,736 LUT4 · 828 Kbit block RAM</text>
  <text x="782" y="183" text-anchor="middle" font-size="11.5" fill="#475569">48 multipliers · 4 PLLs</text>
  <text x="782" y="200" text-anchor="middle" font-size="11.5" fill="#475569">27 MHz clock on ball H11</text>

  <rect x="665" y="255" width="110" height="52" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="720" y="277" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">SPI flash</text>
  <text x="720" y="295" text-anchor="middle" font-size="11" fill="#475569">8 MB, boot image</text>
  <rect x="790" y="255" width="110" height="52" rx="8" fill="#ffffff" stroke="#16a34a"/>
  <text x="845" y="277" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f172a">DDR3</text>
  <text x="845" y="295" text-anchor="middle" font-size="11" fill="#475569">128 MB</text>

  <rect x="245" y="320" width="365" height="70" rx="10" fill="#ffffff" stroke="#334155"/>
  <text x="427" y="345" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">On-board I/O</text>
  <text x="427" y="364" text-anchor="middle" font-size="11.5" fill="#475569">8 LEDs · 8 switches · 8 buttons · 4-digit 7-segment</text>
  <text x="427" y="380" text-anchor="middle" font-size="11.5" fill="#475569">buzzer · PIR · LIS3DH accelerometer · 2 PMOD · 2x20 header</text>

  <!-- PC <-> CP2105 -->
  <line x1="181" y1="185" x2="244" y2="185" stroke="#334155" stroke-width="1.6" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="212" y="177" text-anchor="middle" font-size="11" fill="#334155">USB</text>

  <!-- Enhanced port -> ChipLoader -->
  <path d="M396,165 L415,165 L415,135 L438,135" fill="none" stroke="#2563eb" stroke-width="1.6" marker-start="url(#b)" marker-end="url(#b)"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#2563eb">Enhanced port</text>
  <text x="320" y="133" text-anchor="middle" font-size="10.5" fill="#2563eb">115200 baud, KISS frames</text>

  <!-- ChipLoader -> DirtyJTAG -->
  <line x1="525" y1="176" x2="525" y2="208" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="533" y="196" font-size="11" fill="#334155">USB</text>

  <!-- DirtyJTAG -> FPGA (JTAG) -->
  <path d="M611,240 L626,240 L626,185 L663,185" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="631" y="178" font-size="11" fill="#334155">JTAG</text>

  <!-- Standard port <-> FPGA UART -->
  <path d="M320,221 L320,292 L652,292 L652,207 L663,207" fill="none" stroke="#16a34a" stroke-width="1.6" marker-start="url(#g)" marker-end="url(#g)"/>
  <text x="330" y="309" font-size="11" fill="#15803d">Standard port: your design's UART (balls N8 / L9)</text>

  <!-- FPGA <-> flash, DDR3 -->
  <line x1="720" y1="221" x2="720" y2="253" stroke="#16a34a" stroke-width="1.6" marker-start="url(#g)" marker-end="url(#g)"/>
  <line x1="845" y1="221" x2="845" y2="253" stroke="#16a34a" stroke-width="1.6" marker-start="url(#g)" marker-end="url(#g)"/>

  <!-- FPGA <-> on-board I/O -->
  <path d="M901,170 L916,170 L916,355 L612,355" fill="none" stroke="#16a34a" stroke-width="1.6" marker-start="url(#g)" marker-end="url(#g)"/>
</svg>
